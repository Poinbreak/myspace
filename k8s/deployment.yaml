apiVersion: apps/v1
kind: Deployment
metadata:
  name: myspace-deployment
  labels:
    app: myspace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myspace
  template:
    metadata:
      labels:
        app: myspace
    spec:
      containers:
      - name: myspace
        # Placeholder image URL - will be replaced with actual ECR image path
        image: 514661752885.dkr.ecr.ap-south-1.amazonaws.com/myspace:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
