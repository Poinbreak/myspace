apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myspace-ingress
  annotations:
    # Use the AWS ALB Ingress Controller
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    
    # Target type 'ip' routes traffic directly to pods (requires ClusterIP service)
    # Target type 'instance' routes traffic to NodePorts on nodes (requires NodePort service)
    alb.ingress.kubernetes.io/target-type: ip
    
    # --- Optional: SSL / HTTPS Configuration ---
    # To enable HTTPS, uncomment the annotations below and replace the certificate ARN:
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:<AWS_ACCOUNT_ID>:certificate/<CERTIFICATE_UUID>
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: myspace-service
            port:
              number: 80
